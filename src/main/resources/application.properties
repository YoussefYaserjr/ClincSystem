spring.application.name=clinicsystem

server.port=8080

# Prefer env vars in real deployments: DB_USERNAME, DB_PASSWORD, JWT_SECRET
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Must be at least 32 characters for HS256. Override with JWT_SECRET in production.
jwt.secret=${JWT_SECRET:replace_this_with_a_long_random_base64_string_at_least_256_bits_for_hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Initial admin account (created on startup only if no admin exists)
app.admin.email=${ADMIN_EMAIL:admin@clinic.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:Clinic Admin}

# Email notifications (requires spring.mail.* and app.notifications.enabled=true)
app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
app.notifications.from=${NOTIFICATIONS_FROM:no-reply@clinicsystem.local}

# SMTP transport (Mailtrap by default for dev; set MAIL_USERNAME/MAIL_PASSWORD)
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# How long before the appointment start the reminder email is sent (hours)
app.notifications.reminder-hours-before=${NOTIFICATIONS_REMINDER_HOURS:1}
# How often the reminder scheduler scans for upcoming appointments (ms)
app.notifications.reminder-interval-ms=${NOTIFICATIONS_REMINDER_INTERVAL_MS:60000}

# In-memory rate limiting (auth + booking endpoints). Disabled by default.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
# Backend: memory (default, single instance) or redis (distributed across replicas)
app.rate-limit.store=${RATE_LIMIT_STORE:memory}
app.rate-limit.auth-max=${RATE_LIMIT_AUTH_MAX:20}
app.rate-limit.auth-window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}
app.rate-limit.booking-max=${RATE_LIMIT_BOOKING_MAX:10}
app.rate-limit.booking-window-seconds=${RATE_LIMIT_BOOKING_WINDOW:60}

# Redis (only used when app.rate-limit.store=redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# Actuator: health/metrics for orchestrators (Kubernetes probes, Prometheus scraping)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Liveness/readiness probes for Kubernetes: /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Redis is optional by design (the rate limiter fails open); don't fail the pod's
# health checks when it is not configured. Set REDIS_HEALTH_ENABLED=true when you rely on it.
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

info.app.name=${spring.application.name}
info.app.description=Clinic booking system API

# Request access log (file, not console) - one line per request in logs/access_log.*.log.
# In Docker the directory is overridden to /logs (see docker-compose.yml).
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
server.tomcat.accesslog.pattern=%h %t %m %U %s %b %D
