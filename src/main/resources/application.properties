spring.application.name=clinicsystem

server.port=8080

# Prefer env vars in real deployments: DB_USERNAME, DB_PASSWORD, JWT_SECRET
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Must be at least 32 characters for HS256. Override with JWT_SECRET in production.
jwt.secret=${JWT_SECRET:replace_this_with_a_long_random_base64_string_at_least_256_bits_for_hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
