spring.application.name=clinicsystem

server.port=8080

# Prefer env vars in real deployments: DB_USERNAME, DB_PASSWORD, JWT_SECRET
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Must be at least 32 characters for HS256. Override with JWT_SECRET in production.
jwt.secret=${JWT_SECRET:replace_this_with_a_long_random_base64_string_at_least_256_bits_for_hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial admin account (created on startup only if no admin exists)
app.admin.email=${ADMIN_EMAIL:admin@clinic.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:Clinic Admin}

# Email notifications (requires spring.mail.* and app.notifications.enabled=true)
app.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
app.notifications.from=${NOTIFICATIONS_FROM:no-reply@clinicsystem.local}

# In-memory rate limiting (auth + booking endpoints). Disabled by default.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
# Backend: memory (default, single instance) or redis (distributed across replicas)
app.rate-limit.store=${RATE_LIMIT_STORE:memory}
app.rate-limit.auth-max=${RATE_LIMIT_AUTH_MAX:20}
app.rate-limit.auth-window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}
app.rate-limit.booking-max=${RATE_LIMIT_BOOKING_MAX:10}
app.rate-limit.booking-window-seconds=${RATE_LIMIT_BOOKING_WINDOW:60}

# Redis (only used when app.rate-limit.store=redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
