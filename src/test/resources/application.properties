spring.application.name=clinicsystem-test

# Clean schema per test context; Testcontainers provides the datasource
# via @ServiceConnection, so DB_URL/DB_USERNAME/DB_PASSWORD are ignored here.
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=false

# Re-declared here because src/test/resources shadows src/main/resources
# on the test classpath (needed by JwtService).
jwt.secret=${JWT_SECRET:replace_this_with_a_long_random_base64_string_at_least_256_bits_for_hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
logging.level.org.testcontainers=WARN
