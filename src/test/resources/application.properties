spring.application.name=clinicsystem-test

# Clean schema per test context; Testcontainers provides the datasource
# via @ServiceConnection, so DB_URL/DB_USERNAME/DB_PASSWORD are ignored here.
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=false

# Re-declared here because src/test/resources shadows src/main/resources
# on the test classpath (needed by JwtService).
jwt.secret=${JWT_SECRET:replace_this_with_a_long_random_base64_string_at_least_256_bits_for_hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.email=${ADMIN_EMAIL:admin@clinic.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.name=${ADMIN_NAME:Clinic Admin}

app.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
app.notifications.from=${NOTIFICATIONS_FROM:no-reply@clinicsystem.local}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
app.rate-limit.auth-max=${RATE_LIMIT_AUTH_MAX:20}
app.rate-limit.auth-window-seconds=${RATE_LIMIT_AUTH_WINDOW:60}
app.rate-limit.booking-max=${RATE_LIMIT_BOOKING_MAX:10}
app.rate-limit.booking-window-seconds=${RATE_LIMIT_BOOKING_WINDOW:60}

logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
logging.level.org.testcontainers=WARN
