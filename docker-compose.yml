services:
  db:
    image: mysql:8.4
    container_name: clinic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123123}
      MYSQL_DATABASE: clinic
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: youssefyaser/clinicsystem:latest
    container_name: clinic-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # DB_PASSWORD / JWT_SECRET / ADMIN_PASSWORD come from your .env file
      DB_URL: jdbc:mysql://db:3306/clinic?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123123}
      JWT_SECRET: ${JWT_SECRET:-replace_this_with_a_long_random_base64_string_at_least_256_bits_for_hs256}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@clinic.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      # Email notifications via SMTP (Mailtrap by default)
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Distributed rate limiting (RATE_LIMIT_STORE=redis) across replicas
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Request access log: one line per request written to /logs (volume-mounted below)
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
      SERVER_TOMCAT_ACCESSLOG_DIRECTORY: /logs
    volumes:
      - app-logs:/logs
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    image: youssefyaser/clinicsystem-frontend:latest
    container_name: clinic-frontend
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Name of the backend service inside the compose network (see frontend/nginx)
      BACKEND_HOST: app:8080
    ports:
      - "8080:80"

  redis:
    image: redis:7-alpine
    container_name: clinic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
  app-logs:
